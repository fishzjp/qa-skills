name: 🐛 Bug / 缺陷报告
description: Report an installation, helper or skill defect / 报告安装、脚本或 skill 缺陷
labels:
- bug
body:
- type: dropdown
  id: area
  attributes:
    label: Area / 问题区域
    options:
    - qa（编排）
    - qa-memory（项目知识库）
    - test-case-writing / test-case-review（用例）
    - test-strategy / requirement-analysis（策略与需求）
    - automated-e2e-testing / api-testing（执行）
    - bug-analysis / regression-testing / exploratory-testing / test-reliability（其他 skill）
    - 安装 / CI / 工程链路
    - 其他
  validations:
    required: true
- type: textarea
  id: desc
  attributes:
    label: Problem / 问题描述
    description: Describe the stage, expected behavior and actual behavior / 说明环节、预期和实际
  validations:
    required: true
- type: textarea
  id: repro
  attributes:
    label: Reproduction / 复现步骤
    description: Provide redacted minimal input and relevant expected/actual output / 提供脱敏最小输入与关键产出
    placeholder: '1. Skill and request / skill 与请求

      2. Redacted input / 脱敏输入

      3. Expected vs actual / 预期与实际'
  validations:
    required: true
- type: textarea
  id: installation
  attributes:
    label: Installation and version / 安装方式与版本
    description: skills.sh / Git copy / Git link / legacy plugin; tag/full commit; include qa-skills.VERSION if present. Never
      include credentials. / 提供渠道、版本或 commit；版本标记可选，勿贴凭证。
  validations:
    required: true
- type: textarea
  id: env
  attributes:
    label: Environment / 环境
    placeholder: Host/version; model/version; OS; installed and actually loaded paths / 宿主、模型、系统版本及实际装载路径
  validations:
    required: true
- type: textarea
  id: extra
  attributes:
    label: Additional context / 补充（可选）
    description: Redacted screenshots/logs and hypotheses / 脱敏截图、日志与推测
