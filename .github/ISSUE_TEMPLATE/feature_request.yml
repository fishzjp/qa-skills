name: 💡 Feature / 功能建议
description: Describe a concrete testing need / 描述具体测试需求
labels:
- enhancement
body:
- type: textarea
  id: problem
  attributes:
    label: Problem to solve / 想解决什么问题
    description: What task is currently difficult or unsupported? / 什么任务当前难以完成？
  validations:
    required: true
- type: textarea
  id: solution
  attributes:
    label: Expected behavior / 期望的行为
    description: Describe the outcome and relation to existing skills/core; avoid just requesting more skill names. / 说明产出及与现有
      skills/core 的关系。
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives / 替代方案（可选）
    description: 考虑过的其他做法与取舍
- type: textarea
  id: context
  attributes:
    label: Context / 附加上下文（可选）
    description: Examples, links and redacted experience / 示例、链接与脱敏实践
