name: 💡 功能建议
description: 新 skill、方法论增强、core 知识库、工具脚本、文档
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现状的痛点：什么场景下现在的 skill 覆盖不了或效果不好
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 若涉及新方法论，请说明它与 core/ 共享知识库（evidence / risk-model / executability / testing-principles / case-format / coverage / schema-extraction / clarify-pattern / test-type-matrix / triage / pipeline-integration / report-template + methods/ + scripts/，完整清单见 README 仓库结构）的关系
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 考虑过的其他做法与取舍
  - type: textarea
    id: context
    attributes:
      label: 附加上下文（可选）
      description: 同类工具 / 文章 / 自身实践的参考链接
