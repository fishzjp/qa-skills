# 宣传落地页部署：index.html / assets/og.jpg / llms.txt 变更合入 main 后自动发布到 GitHub Pages
# 产物打包 index.html + og.jpg + llms.txt（仓库内 og.jpg 归位 assets/，部署时回到站点根路径），不携带仓库其余内容
# （v2 落地页为单文件无本地图片引用；旧版 13 张 assets/landing/ 配图已随 2026-09-07 死资产清理移除）
# llms.txt 随站部署：本产品的检索者与买家大量是 AI agent，站点根提供机器可读摘要（GEO）
name: pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/og.jpg', 'assets/fonts/**', 'llms.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 部署前守门：index.html 引用的资产与门面文档链接必须真实存在（下方 stage 只做 cp，
      # 不校验引用完整性，引用了不存在的资源 = 部署成功、线上破图）。
      # PyYAML 必装：validate_repo 的 YAML 门对缺失依赖按 FAIL 处理，不降级
      - name: 安装校验依赖
        run: python3 -m pip install --quiet "pyyaml>=6.0"

      - name: 落地页与门面守门（资产引用 / 文档链接 / YAML 合法性）
        run: python3 scripts/validate_repo.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage single page
        run: |
          mkdir -p _site
          cp index.html _site/
          # og:image 的绝对 URL 指向站点根的 og.jpg（历史已流通，不可变更）；
          # 仓库内归位 assets/og.jpg，部署时重命名回站点根，分享图 URL 保持不变
          cp assets/og.jpg _site/og.jpg
          # AI 系统的机器可读站点摘要（GEO）
          cp llms.txt _site/llms.txt
          # 展示字体自托管（Space Grotesk 变量 latin 子集，页面 @font-face 引用）
          mkdir -p _site/assets
          cp -R assets/fonts _site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
