# 宣传落地页部署：index.html / assets/og.jpg / llms.txt 变更合入 main 后自动发布到 GitHub Pages
# 同一源生成中文根页、静态 /en/、sitemap、llms 与含许可的字体；不携带私有规划与评测文件
# llms.txt 随站部署：本产品的检索者与买家大量是 AI agent，站点根提供机器可读摘要（GEO）
name: pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/og.jpg', 'assets/fonts/**', 'llms.txt', 'requirements-dev.txt', 'scripts/validate_repo.py', 'scripts/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # 部署前守门：资源/文档/双语结构校验；静态生成由独立测试覆盖。
      # PyYAML 必装：validate_repo 的 YAML 门对缺失依赖按 FAIL 处理，不降级
      - name: 安装校验依赖
        run: python3 -m pip install -r requirements-dev.txt

      - name: 落地页与门面守门（资产引用 / 文档链接 / YAML 合法性）
        run: python3 scripts/validate_repo.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build static language pages and licensed assets
        run: python3 scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
