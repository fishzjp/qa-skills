# 宣传落地页部署：index.html / 配图 / assets/og.jpg 变更合入 main 后自动发布到 GitHub Pages
# 产物打包 index.html + og.jpg（仓库内为 assets/og.jpg，部署时回到站点根路径）+ assets/landing/ 配图目录，不携带仓库其余内容
name: pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/og.jpg', 'assets/landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 部署前守门：index.html 引用的配图与门面文档链接必须真实存在（下方 stage 只做 cp，
      # 不校验引用完整性，引用了不存在的图 = 部署成功、线上破图）。
      # PyYAML 未装时 validate_repo 的 YAML 门降级跳过并明示，语法面由同 commit 的 CI 全量覆盖
      - name: 落地页与门面守门（资产引用 / 文档链接）
        run: python3 scripts/validate_repo.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage single page
        run: |
          mkdir -p _site
          cp index.html _site/
          # og:image 的绝对 URL 指向站点根的 og.jpg（历史已流通，不可变更）；
          # 仓库内归位 assets/og.jpg，部署时重命名回站点根，分享图 URL 保持不变
          cp assets/og.jpg _site/og.jpg
          # 落地页配图为静态资源（assets/landing/），缺失即整站破图
          mkdir -p _site/assets
          cp -R assets/landing _site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
