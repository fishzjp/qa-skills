name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: 架构红线与语法校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Skills 架构红线校验（frontmatter / ≤500 行 / When NOT to Use / 引用完整性 / JSON）
        run: python3 scripts/validate_skills.py

      - name: 安装 harness 单测依赖
        run: python3 -m pip install --quiet requests pytest pyyaml

      - name: Harness 纯函数单测（统计/judge 校验/代码块解析/可执行性检查）
        run: python3 -m pytest tests/ -q

      - name: Python 语法检查（harness 与 mock 服务）
        run: |
          python3 -m py_compile eval/harness/run_eval.py eval/harness/fixtures/mock_api/server.py
          echo "python syntax OK"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Node 语法检查（mock 被测应用）
        run: |
          node --check eval/harness/fixtures/playwright_scaffold/mock_app/server.js
          node --check eval/harness/fixtures/playwright_scaffold/tests/helpers.ts

  label:
    name: PR 自动打标
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
