# PR 按改动路径自动打标(与仓库已建 label 对齐)
"skill:方法论":
  - changed-files:
      - any-glob-to-any-file:
          - "skills/**"

engineering:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "tests/**"
          - ".dsh/**"
          - "install.sh"
          - "uninstall.sh"
          - "package.json"
          - ".gitignore"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "examples/**"
          - "assets/**"
          - "index.html"
