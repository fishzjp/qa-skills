# PR 按改动路径自动打标(与已建 label 对齐)
"skill:方法论":
  - changed-files:
      - any-glob-to-any-file:
          - "skills/*/SKILL.md"
          - "skills/core/**"
          - "skills/*/references/**"
          - "skills/*/templates/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "examples/**"
          - "assets/**"
          - ".github/**"
