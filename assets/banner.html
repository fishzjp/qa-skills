<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* ——— 画布：1280×640，浅雾底 + 双侧环境光（左蓝右紫，苹果产品页背景手法） ——— */
  body { width: 1280px; height: 640px; overflow: hidden;
         font-family: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
         background:
           radial-gradient(900px 600px at 12% 8%,  rgba(0, 113, 227, 0.08), transparent 60%),
           radial-gradient(900px 600px at 88% 92%, rgba(191, 90, 242, 0.07), transparent 60%),
           linear-gradient(180deg, #ffffff 0%, #f9f9fb 60%, #f2f2f5 100%);
         color: #1d1d1f;
         display: flex; flex-direction: column; align-items: center; }

  /* ——— 眉标：小号蓝色引导词，建立进场节奏 ——— */
  .eyebrow { margin-top: 186px; font-size: 21px; font-weight: 600;
             color: #0071e3; letter-spacing: 0.4px; }

  /* ——— 主标题：渐变文字（Apple Intelligence 手法），同色系深浅渐变保证对比度 ——— */
  .wordmark { margin-top: 16px; font-size: 116px; font-weight: 600;
              letter-spacing: -3px; line-height: 1.04;
              background: linear-gradient(115deg, #0033a0 0%, #0071e3 42%, #00a7e6 78%, #7d4dff 105%);
              -webkit-background-clip: text; background-clip: text;
              -webkit-text-fill-color: transparent; }

  /* ——— 副标：中灰常规字重，信息层 ——— */
  .subhead { margin-top: 26px; font-size: 28px; font-weight: 400;
             color: #6e6e73; letter-spacing: 0.1px; }

  /* ——— 三支柱：发丝线描边标签，决策蓝强调 ——— */
  .chips { margin-top: 44px; display: flex; gap: 14px; }
  .chip { font-size: 15px; font-weight: 500; padding: 9px 24px;
          border-radius: 980px; border: 1px solid #d2d2d7; color: #494949;
          letter-spacing: 0.3px;
              background: rgba(255, 255, 255, 0.65); }
  .chip.hot { border-color: rgba(0, 113, 227, 0.45); color: #0071e3;
              background: rgba(0, 113, 227, 0.06); }
</style>
</head>
<body>
  <div class="eyebrow">面向 AI Agent</div>
  <div class="wordmark">QA Skills</div>
  <div class="subhead">让 AI 像资深测试工程师一样工作</div>
  <div class="chips">
    <span class="chip">知识</span>
    <span class="chip">工具</span>
    <span class="chip hot">决策</span>
  </div>
</body>
</html>
