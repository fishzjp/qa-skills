<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 640px; overflow: hidden;
         font-family: -apple-system, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: linear-gradient(165deg, #090c10 0%, #0d1117 55%, #111722 100%);
         color: #e6edf3; position: relative;
         display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dots { position: absolute; inset: 0;
          background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
          background-size: 26px 26px;
          mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, black 30%, transparent 75%); }
  .glow { position: absolute; width: 1100px; height: 700px; border-radius: 50%;
          background: radial-gradient(ellipse, rgba(16,185,129,0.10) 0%, transparent 62%);
          top: -140px; left: 50%; transform: translateX(-50%); }
  .lockup { position: relative; display: flex; align-items: center; gap: 44px; }
  .logo { width: 176px; height: 176px; border-radius: 44px;
          background: linear-gradient(140deg, #34d399 0%, #10b981 48%, #047857 100%);
          box-shadow: 0 24px 70px rgba(16,185,129,0.35),
                      inset 0 2px 2px rgba(255,255,255,0.28),
                      inset 0 -18px 36px rgba(0,0,0,0.22);
          display: flex; align-items: center; justify-content: center; }
  .wordmark { font-size: 100px; font-weight: 800; letter-spacing: -3px; line-height: 1.04; color: #f0f6fc; }
  .wordmark .grad { background: linear-gradient(92deg, #6ee7b7 0%, #34d399 45%, #22d3ee 100%);
                    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { margin-top: 18px; font-size: 30px; font-weight: 500; color: #9aa7b3; letter-spacing: 0.5px; }
  .pipeline { position: absolute; bottom: 66px; left: 0; right: 0;
              display: flex; align-items: center; justify-content: center; gap: 14px;
              font-size: 19px; color: #7d8590; font-weight: 500; white-space: nowrap; }
  .pipeline .arr { color: rgba(52,211,153,0.45); font-size: 16px; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="lockup">
    <div class="logo">
      <svg width="104" height="104" viewBox="0 0 96 96" fill="none">
        <circle cx="42" cy="42" r="26" stroke="white" stroke-width="9"/>
        <line x1="61.5" y1="61.5" x2="86" y2="86" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <path d="M31 43 L40 52 L56 35" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="text">
      <div class="wordmark">QA <span class="grad">Skills</span></div>
      <div class="tagline">让 AI 像资深测试工程师一样工作</div>
    </div>
  </div>
  <div class="pipeline">
    <span>需求理解</span><span class="arr">→</span>
    <span>风险分析</span><span class="arr">→</span>
    <span>测试策略</span><span class="arr">→</span>
    <span>用例编写</span><span class="arr">→</span>
    <span>审查</span><span class="arr">→</span>
    <span>自动化执行</span><span class="arr">→</span>
    <span>Bug 分析</span><span class="arr">→</span>
    <span>测试报告</span>
  </div>
</body>
</html>
